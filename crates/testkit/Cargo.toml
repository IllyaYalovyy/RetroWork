[package]
name = "retrowork-testkit"
description = "Test support for RetroWork: UI scenarios, the native end-to-end runner and the performance gate."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
image = { workspace = true }
retrowork-cargo = { workspace = true }
retrowork-demo = { workspace = true }
retrowork-logs = { workspace = true }
retrowork-platform = { workspace = true }
retrowork-projects = { workspace = true }
retrowork-workbench = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
x11rb = { workspace = true }

[dev-dependencies]
# Enables GPUI's headless test platform for the tests in `tests/` only; the
# end-to-end runner and the demo executable are built without it.
gpui = { workspace = true, features = ["test-support"] }
retrowork-log-stats = { workspace = true }
semver = { workspace = true }
syn = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
