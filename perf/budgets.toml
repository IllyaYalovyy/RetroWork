# Performance budgets for explicitly requested exclusive-host runs.
#
# Each limit applies to one statistic of a metric's samples: p50 (median),
# p90 or max, using nearest-rank percentiles. A metric over any of its limits,
# without samples, or without a budget fails the gate.
#
# Basis: three runs of the release build on 2026-11-17, AMD Ryzen 5 3500U
# (8 logical CPUs), Fedora 45, kernel 7.3.3, rustc 1.99.1, nested Xwayland
# window 1200x780, XTEST input. The machine was shared: 1-minute load average
# 7.5 to 17 during the runs. Each limit is about 1.5 to 2 times the worst
# value observed, so that load noise passes and a regression of that size
# fails. Change a limit only by hand, with new measurements in its basis; the
# runner never writes this file.
#
# These are coarse regression baselines for this machine, not product targets.
# Window timings end when a prepared frame's semantic state shows the change;
# they include polling and the observation round trip and exclude painting,
# GPU work and presentation.

[metric.startup_to_ready_window]
unit = "milliseconds"
basis = "process start until the window exists, has focus and a prepared frame reports elements; p50 223/283/304, p90 291/344/485"
limits = { p50 = 600, p90 = 1000 }

[metric.rss_idle]
unit = "mebibytes"
basis = "resident memory after startup with the sample packages; 96.9 to 97.6 in all runs"
limits = { p90 = 130 }

[metric.rss_large_log]
unit = "mebibytes"
basis = "resident memory with the 200,000-record log open; 291 to 320 in all runs"
limits = { p90 = 420 }

[metric.peak_rss_large_log]
unit = "mebibytes"
basis = "peak resident memory after opening, filtering and closing the large log 6 times; 321 in all runs"
limits = { max = 420 }

[metric.large_log_open]
unit = "milliseconds"
basis = "XTEST click in Sources until a prepared frame shows 200,000 records; p50 204/273/279, p90 277/354/384"
limits = { p50 = 550, p90 = 800 }

[metric.large_log_filter]
unit = "milliseconds"
basis = "XTEST filter shortcut until a prepared frame shows the filtered 200,000-record log; p50 103/109/140, p90 154/162/194"
limits = { p50 = 300, p90 = 450 }

[metric.click_to_semantic_state]
unit = "milliseconds"
basis = "XTEST click on a bottom-dock tab until a prepared frame reports it selected, large log open; includes polling and observation; p50 35/45/64, p90 40/64/79"
limits = { p50 = 150, p90 = 250 }

[metric.key_to_semantic_state]
unit = "milliseconds"
basis = "XTEST Ctrl+4 until a prepared frame reports the Output tab selected, large log open; includes polling and observation; p50 24/28/41, p90 32/40/50"
limits = { p50 = 100, p90 = 200 }

[metric.observation_round_trip]
unit = "milliseconds"
basis = "one automation snapshot request; included at least once in every window timing; p50 0.4/0.8/0.9, p90 0.5/1.4/9.7"
limits = { p50 = 5, p90 = 30 }

[metric.log_parse_200k]
unit = "milliseconds"
basis = "parse the 200,000-line log without a window; p50 116/119/332 (332 during a parallel release build), p90 125/134/345"
limits = { p50 = 350, p90 = 500 }

[metric.log_filter_200k]
unit = "milliseconds"
basis = "one query over 200,000 parsed records; p50 19/20/58, p90 22/23/70"
limits = { p50 = 60, p90 = 90 }

[metric.platform_build]
unit = "milliseconds"
basis = "resolve and activate all modules and packages, no window; p50 0.3/0.5/1.0, p90 0.3/0.6/1.0"
limits = { p50 = 5, p90 = 10 }

[metric.plugin_cold_start]
unit = "milliseconds"
basis = "first request to the sample process plugin, including process start and handshake, 5,000 records; p50 26/29/103, p90 27/35/119"
limits = { p50 = 150, p90 = 250 }

[metric.plugin_round_trip]
unit = "milliseconds"
basis = "request to a running sample process plugin with 5,000 records, after 3 warm-up requests; p50 30/31/68, p90 32/32/89"
limits = { p50 = 120, p90 = 180 }

# Added with the Cargo project workflow, from three runs on 2026-11-18 on the
# same machine; 1-minute load average 26.5, 9.2 and 7.3 at their starts.

[metric.project_discovery_40_units]
unit = "milliseconds"
basis = "cargo metadata of a generated 40-package workspace and parsing it, no window; p50 53/70/107, p90 53/85/116"
limits = { p50 = 200, p90 = 250 }

[metric.project_open_to_tree]
unit = "milliseconds"
basis = "XTEST Enter in the project field until a prepared frame shows all 40 packages; includes discovery, polling and observation; p50 235/420/422, p90 393/482/491"
limits = { p50 = 800, p90 = 1000 }

[metric.task_output_100k_lines]
unit = "milliseconds"
basis = "task runner streaming 100,000 lines from seq through the Cargo provider's interpretation, no window; p50 477/657/1272, p90 521/729/1758"
limits = { p50 = 2000, p90 = 3000 }
