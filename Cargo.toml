[workspace]
resolver = "3"
default-members = ["apps/demo"]
members = [
    "apps/demo",
    "crates/platform",
    "crates/testkit",
    "crates/workbench",
    "experiments/file-finder",
    "plugins/cargo",
    "plugins/external-sample",
    "plugins/log-stats",
    "plugins/logs",
    "plugins/ninja",
    "plugins/projects",
]
# Test projects opened by the Cargo tests; never built as part of this workspace.
exclude = ["fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
retrowork-cargo = { path = "plugins/cargo" }
retrowork-demo = { path = "apps/demo" }
retrowork-log-stats = { path = "plugins/log-stats" }
retrowork-logs = { path = "plugins/logs" }
retrowork-ninja = { path = "plugins/ninja" }
retrowork-platform = { path = "crates/platform" }
retrowork-projects = { path = "plugins/projects" }
retrowork-testkit = { path = "crates/testkit" }
retrowork-workbench = { path = "crates/workbench" }

# GPUI stack. `gpui-kit` pins the matching `gpui-pre` snapshot (=0.3.12) and the
# Longbridge component crates. Upgrade them together and rerun `bash scripts/check.sh`.
# It is imported under the name `gpui` because GPUI's derive macros emit
# `gpui::` paths and the kit re-exports all of GPUI at its root.
gpui = { package = "gpui-kit", version = "=0.10.0" }

futures = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Safe process-group signalling for the task runner.
rustix = { version = "1.1.6", default-features = false, features = ["std", "process", "fs"] }
ropey = "=2.0.0-beta.1"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.144"
# Rust parser for the source-rule tests.
syn = { version = "2.0.119", default-features = false, features = ["full", "parsing"] }
tempfile = "3.27"
thiserror = "2.0.12"
toml = "0.8.23"
x11rb = { version = "0.13.2", features = ["xtest"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
